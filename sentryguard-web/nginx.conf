server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # El cuerpo de las peticiones a la API es pequeno (JSON): limite bajo para frenar abusos (OWASP API4)
    client_max_body_size 1m;

    # Cabeceras de seguridad (OWASP API8). La CSP de la SPA va como <meta> en el index.html.
    # En produccion el TLS termina en el balanceador o en este mismo nginx y se agrega Strict-Transport-Security.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Sonda de salud propia de nginx (no depende de la API)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # SPA: cualquier ruta del cliente devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre no cambian: cache larga
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # API. X-Forwarded-For se fija con la IP del cliente (no se acumula lo que mande el cliente):
    # asi no se puede falsear la IP para evadir el limite de intentos de login.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Estado de la API y documentacion interactiva (OpenAPI / Scalar)
    location = /health {
        proxy_pass http://api:8080/health;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ~ ^/(openapi|scalar)/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
