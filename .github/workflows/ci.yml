name: CI/CD de SentryGuard

# Construye, prueba y, solo si todo pasa y estamos en main, publica las imagenes en GitHub Container Registry.
# No usa secretos propios: las claves de las pruebas se generan al vuelo, se enmascaran en los logs y viven
# solo en el runner. La publicacion usa el GITHUB_TOKEN efimero del propio workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10, pruebas con SQL Server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # SQL Server efimero para las pruebas de integracion. La contrasena es aleatoria y se enmascara.
      - name: Levantar SQL Server de pruebas
        run: |
          SA="Ci$(openssl rand -hex 12)Aa1"
          echo "::add-mask::$SA"
          echo "SA_PASSWORD=$SA" >> "$GITHUB_ENV"
          docker run -d --name sql-pruebas -p 1433:1433 \
            -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA" \
            mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
          for i in $(seq 1 40); do
            if docker exec sql-pruebas /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA" -C -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server listo"; exit 0
            fi
            sleep 3
          done
          echo "SQL Server no arranco"; docker logs sql-pruebas | tail -20; exit 1

      - name: Restaurar y compilar
        run: |
          dotnet restore SentryGuard.slnx
          dotnet build SentryGuard.slnx -c Release --no-restore

      - name: Pruebas unitarias y de integracion
        env:
          ConnectionStrings__DefaultConnection: Server=localhost,1433;Database=SentryGuardDB_Test;User Id=sa;Password=${{ env.SA_PASSWORD }};TrustServerCertificate=True;
        run: dotnet test SentryGuard.slnx -c Release --no-build --logger "trx;LogFileName=resultados.trx" --results-directory TestResults

      - name: Paquetes NuGet con vulnerabilidades
        continue-on-error: true
        run: |
          dotnet list SentryGuard.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerables.txt
          ! grep -q "tiene las siguientes vulnerabilidades\|has the following vulnerable" vulnerables.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resultados-backend
          path: |
            TestResults/
            vulnerables.txt

  frontend:
    name: Frontend (lint, pruebas y build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sentryguard-web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sentryguard-web/package-lock.json

      - run: npm ci
      - name: Lint (incluye reglas de accesibilidad)
        run: npm run lint
      - name: Pruebas de componentes
        run: npm test -- --run
      - name: Build de produccion
        run: npm run build
        env:
          VITE_API_URL: same-origin
      - name: Auditoria de dependencias
        run: npm audit --audit-level=high

  contenedores:
    name: Contenedores (build y arranque con docker compose)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Generar .env con claves aleatorias
        run: |
          bash ./scripts/generar-env.sh
          # Enmascarar en los logs antes de que algo pueda imprimirlas
          while IFS='=' read -r clave valor; do
            case "$clave" in SA_PASSWORD|JWT_KEY) echo "::add-mask::$valor" ;; esac
          done < .env

      - name: Construir imagenes y levantar el sistema
        # Sin --wait: el contenedor seed termina con codigo 0 a proposito y --wait lo toma como fallo
        run: docker compose -f compose.yaml up --build -d

      - name: Comprobar que el sistema responde
        run: |
          # Espera a que la API (migraciones + health) y el seed terminen: hasta 5 minutos
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8088/health >/dev/null 2>&1 && [ "$(docker inspect -f '{{.State.Status}}' sentryguard-seed)" = "exited" ] && break
            sleep 5
          done
          curl -fsS http://localhost:8088/health
          curl -fsS http://localhost:8088/ | grep -qi "<div id=\"root\""
          curl -fsS http://localhost:8088/api/v1/catalogos/severidades | grep -q "Alta"
          test "$(docker inspect -f '{{.State.ExitCode}}' sentryguard-seed)" = "0"

      - name: Registros si algo fallo
        if: failure()
        run: docker compose -f compose.yaml logs --tail 80

      - name: Apagar
        if: always()
        run: docker compose -f compose.yaml down -v

  security:
    name: Escaneo de Seguridad Trivy (D3)
    needs: [contenedores]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build imagen Docker API
        run: docker build -t sentryguard-api:local -f SentryGuard/Dockerfile .

      - name: Build imagen Docker Web
        run: docker build -t sentryguard-web:local -f sentryguard-web/Dockerfile sentryguard-web/

      - name: Escanear imagen API con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'sentryguard-api:local'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Escanear imagen Web con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'sentryguard-web:local'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

  publicar:
    name: Publicar imagenes (solo si todo paso, solo en main)
    needs: [backend, frontend, contenedores, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombre del repositorio en minusculas
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Publicar la API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: SentryGuard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/api:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/api:latest

      - name: Publicar el frontend
        uses: docker/build-push-action@v6
        with:
          context: sentryguard-web
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/web:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/web:latest
